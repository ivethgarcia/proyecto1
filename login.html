<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liga de Fútbol García</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 col-xl-4">

        <!-- Tarjeta de Login -->
        <div class="card card-custom p-4 p-md-5 shadow-lg border-0">
          
          <!-- Logo y Título -->
          <div class="text-center mb-4">
            <div class="league-logo-badge mx-auto mb-3" style="width: 68px; height: 68px;">
              <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 40px; height: 40px;">
                <path d="M32 4L10 12V28C10 44 32 58 32 58C32 58 54 44 54 28V12L32 4Z" fill="#1E3A8A"/>
                <path d="M32 8L14 14.5V28C14 41.5 32 53.5 32 53.5C32 53.5 50 41.5 50 28V14.5L32 8Z" fill="#2563EB"/>
                <circle cx="32" cy="28" r="12" fill="#FFFFFF"/>
                <polygon points="32,20 36,24 34,29 30,29 28,24" fill="#0F172A"/>
                <path d="M32 41L33.8 45H38L34.6 47.4L35.9 51.5L32 49L28.1 51.5L29.4 47.4L26 45H30.2L32 41Z" fill="#F59E0B"/>
              </svg>
            </div>
            <h1 class="h4 fw-bold text-dark mb-1">Panel de Administrador</h1>
            <p class="text-muted small">Ingresa tus credenciales para gestionar el torneo</p>
          </div>

          <!-- Alerta de retroalimentación -->
          <div id="login-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

          <!-- Formulario de Inicio de Sesión -->
          <form id="form-login">
            
            </div>

            
            </div>

            <button type="submit" id="btn-submit" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
            </button>
          </form>

          <!-- Ayuda de Credenciales para Modo Local -->
          
            <span></span><br>
            <strong>Email:</strong> <code>admin@torneo.com</code><br>
            <strong>Password:</strong> <code>admin123</code>
          </div>

          <!-- Enlace de regreso al sitio público -->
          <div class="text-center mt-4 pt-2 border-top">
            <a href="index.html" class="text-decoration-none small text-muted">
              <i class="bi bi-arrow-left me-1"></i> Volver a la Vista Pública
            </a>
          </div>

        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/storage.js"></script>
  <script src="js/supabase.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Si ya tiene sesión activa, redirigir directo al panel
      try {
        const usuario = await window.api.auth.getUser();
        if (usuario) {
          window.location.href = 'admin-equipos.html';
        }
      } catch (err) {}

      const form = document.getElementById('form-login');
      const alertBox = document.getElementById('login-alert');
      const btnSubmit = document.getElementById('btn-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verificando...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          await window.api.auth.login(email, password);
          window.location.href = 'admin-equipos.html';
        } catch (error) {
          alertBox.textContent = error.message || 'Error al iniciar sesión.';
          alertBox.classList.remove('d-none');
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión';
        }
      });
    });
  </script>
</body>
</html>
